# =============================================================================
# v0 設定檔：忠實復現原 notebook（案例 B，DSD-NLA）
# =============================================================================
# 數值全部照抄原 notebook 的 Config 類別與推論設定，v0 階段不要改。
# 想做實驗時，不要直接改這個檔，用以下任一種方式：
#   1. 執行時用 --set 臨時覆蓋，例如：--set train.learning_rate=0.0001
#   2. 複製一份成新檔（例如 configs/exp_lr1e-4.yaml）再改
# 每次執行都會把「實際使用的完整設定」另存一份到該次實驗的資料夾。
# =============================================================================

# 實驗名稱：會出現在輸出資料夾名稱和總表裡，建議寫清楚這次改了什麼
experiment_name: v0_baseline

# 隨機種子：固定之後，同樣設定跑兩次結果會一樣（原 notebook 沒有，問題 P17）
seed: 42

# -----------------------------------------------------------------------------
# 路徑
# -----------------------------------------------------------------------------
paths:
  data_dir: data/hdf5_data_final            # 原本：/kaggle/input/brain-to-text-25/t15_copyTask_neuralData/hdf5_data_final
  checkpoint: checkpoints/best_dsdnla_model.pt   # 原本：/kaggle/input/dsd-nla/checkpoints/best_dsdnla_model.pt
  runs_dir: runs                            # 每次實驗的輸出（不上傳 GitHub）
  summary_csv: experiments/all_runs.csv     # 所有實驗的總表（會上傳 GitHub）

# -----------------------------------------------------------------------------
# 模型結構（原 notebook：Config 類別）
# -----------------------------------------------------------------------------
model:
  n_channels: 512          # 輸入特徵數：256 個電極 × 2 種特徵
  d_model: 512             # 模型內部寬度
  n_encoder_layers: 8      # 編碼器層數
  n_decoder_layers: 6      # 解碼器層數
  n_heads: 8               # 注意力頭數（每個頭 512 ÷ 8 = 64 維）
  dropout: 0.15            # 訓練時；推論時固定為 0
  vocab_size: 36           # 字母表大小（由 CharTokenizer 決定，不要手動改）

# -----------------------------------------------------------------------------
# 訓練（原 notebook：Config 類別）
# -----------------------------------------------------------------------------
train:
  batch_size: 16
  num_epochs: 50           # 最多跑幾輪
  learning_rate: 0.0005    # 最大學習率（OneCycleLR 的 max_lr）
  weight_decay: 0.01       # AdamW 權重衰減
  gradient_clip: 1.0       # 梯度裁剪上限
  patience: 5              # 驗證損失連續幾輪沒進步就提早停止
  use_amp: true            # 混合精度
  num_workers: 2           # 讀資料的工作程序數；讀檔出錯時改成 0（問題 P16）
  # 問題 P7：原作者假設每輪 1,000 步，實際約 505 步
  # v0 保留原寫法；v1 改成 false，改用實際步數計算
  lr_steps_per_epoch_assumed: 1000
  use_assumed_lr_steps: true

# -----------------------------------------------------------------------------
# 損失權重（原 notebook：Config 類別）
# -----------------------------------------------------------------------------
loss:
  text_weight: 1.0
  diffusion_weight: 0.5    # 實際沒有作用（擴散模型沒執行，問題 P2）
  alignment_weight: 0.0    # 實際沒有作用

# -----------------------------------------------------------------------------
# 資料增強（原 notebook：BrainToTextDataset.apply_augment，寫死在程式裡）
# 搬到設定檔，方便之後做實驗
# -----------------------------------------------------------------------------
augment:
  enabled: true
  time_mask_prob: 0.3      # 時間遮罩的機率
  time_mask_min: 5         # 遮罩長度下限（時間點）
  time_mask_max: 15        # 遮罩長度上限（不含）
  channel_drop_prob: 0.2   # 電極關閉的機率
  channel_keep_ratio: 0.9  # 關閉時保留多少比例的通道
  noise_prob: 0.25         # 加雜訊的機率
  noise_std: 0.05          # 雜訊標準差（問題 P15：官方是 1.0）

# -----------------------------------------------------------------------------
# 推論（原 notebook：Cell 2）
# -----------------------------------------------------------------------------
inference:
  use_beam_search: true    # false 會走有 bug 的 generate()（問題 P3）
  beam_width: 10           # 集束寬度
  beam_max_len: 80         # 集束搜尋最長 token 數（問題 P10：長句會被截斷）
  greedy_max_len: 200      # 不用集束搜尋時的最長長度
  temperature: 0.8         # 只影響 generate() 的抽樣
  use_gpt2_rescoring: true # 用 GPT-2 從候選句挑最通順的（問題 P12）
  use_spellcheck: true     # 拼字檢查（問題 P13）

# -----------------------------------------------------------------------------
# 評分
# -----------------------------------------------------------------------------
eval:
  normalize: true          # 計算 WER 前先用官方規則正規化
